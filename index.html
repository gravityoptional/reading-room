<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Room — Editorial Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7EE; --surface:#FDFAF0; --surface-alt:#F4F0E6; --card:#FDFAF0;
  --primary:#2E7D52; --primary-hover:#256746; --primary-light:#E8F4EC; --on-primary:#FFFFFF;
  --secondary:#6B7280; --text:#1F2937; --text-2:#6B7280; --border:#E6DCC6;
  --orange:#F97316; --badge:#C2410C; --badge-ink:#FFFFFF; --green:#2E7D52; --red:#EF4444; --blue:#3B82F6; --purple:#8B5CF6;
  --track:#EDE8DA; --shadow:0 1px 2px rgba(31,41,55,.05);
  --hero-scene:linear-gradient(135deg,#E8DCBC 0%,#C9C49A 38%,#9DB084 64%,#56705A 100%); --hero-a:#F1EAD8; --hero-b:#E6DCC4; --shelf:#D8C9A8;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A; --surface:#1E293B; --surface-alt:#334155; --card:#1E293B;
    --primary:#34D399; --primary-hover:#10B981; --primary-light:#064E3B; --on-primary:#06281B;
    --secondary:#94A3B8; --text:#F8FAFC; --text-2:#94A3B8; --border:#334155;
    --orange:#FB923C; --badge:#FB923C; --badge-ink:#0F172A; --green:#34D399; --track:#334155; --shadow:none;
    --hero-scene:linear-gradient(135deg,#2C4538,#1C3030 50%,#172638); --hero-a:#1E293B; --hero-b:#16213A; --shelf:#475569; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1E293B; --surface-alt:#334155; --card:#1E293B;
  --primary:#34D399; --primary-hover:#10B981; --primary-light:#064E3B; --on-primary:#06281B;
  --secondary:#94A3B8; --text:#F8FAFC; --text-2:#94A3B8; --border:#334155;
  --orange:#FB923C; --badge:#FB923C; --badge-ink:#0F172A; --green:#34D399; --track:#334155; --shadow:none;
  --hero-scene:linear-gradient(135deg,#2C4538,#1C3030 50%,#172638); --hero-a:#1E293B; --hero-b:#16213A; --shelf:#475569; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.005em}
.muted{color:var(--text-2)}
.small{font-size:13px}
.xs{font-size:12px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--border)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--primary);background:none;border:0;padding:0}
.brand svg.i{width:24px;height:24px}
.nav{display:flex;gap:4px;margin-left:16px}
.nav button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--text-2);font-size:14px;font-weight:500}
.nav button[aria-current="page"]{background:var(--primary-light);color:var(--primary)}
.nav button:hover{color:var(--text)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.icon-btn{position:relative;border:0;background:none;padding:8px;border-radius:999px;color:var(--text-2);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-alt);color:var(--text)}
/* Unread count: 10 px numbers need 4.5:1, so deeper orange with white in light, the usual orange with dark numbers in dark (audit 18). */
.badge-dot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--badge);color:var(--badge-ink);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.me-btn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 8px 4px 4px;border-radius:999px;font-size:14px;font-weight:500}
.me-btn:hover{background:var(--surface-alt)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(15,23,42,.14);padding:8px;z-index:20}
.menu[hidden]{display:none}
.menu{max-height:calc(100vh - 90px);overflow-y:auto;overscroll-behavior:contain}   /* a long menu scrolls inside instead of running off the screen */
.menu h3{font-size:16px;padding:8px 10px 4px}
.menu .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px}
.menu .row:hover{background:var(--surface-alt)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .link{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14px}
.menu .link:hover{background:var(--surface-alt)}
.seg{display:inline-flex;background:var(--surface-alt);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:12px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.switch{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--border);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{left:19px}
.notif{padding:10px;border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.notif p{margin:0;font-size:14px}
.notif-go{border:0;background:none;padding:0;text-align:left;flex:1;color:inherit;border-radius:8px}
.notif-go:not([disabled]):hover p{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.notif.read p{color:var(--text-2)}
.notif .x{margin-left:auto}
.menu .notif{padding:12px 10px}
.menu .notif+.notif{border-top:1px solid color-mix(in srgb,var(--border) 75%,transparent);border-radius:0}

/* page */
main{max-width:1240px;margin:0 auto;padding:20px 20px 40px}
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(100deg,var(--hero-a) 0%,var(--hero-a) 45%,var(--hero-b) 100%);padding:26px 28px;display:flex;align-items:center;gap:20px;min-height:132px;background-size:cover;background-position:right center}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:46%;
  background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(46,125,82,.10) 14px 30px,transparent 30px 38px,rgba(180,140,80,.12) 38px 50px,transparent 50px 58px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 40%);mask:linear-gradient(90deg,transparent,#000 40%);pointer-events:none}
.hero-text{position:relative;z-index:1;flex:1}
.hero h1{font-size:32px;line-height:1.15}
.quote{margin:8px 0 0;color:var(--text-2);font-size:14px;max-width:46ch}
.day-card{position:relative;z-index:1;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:14px;padding:14px 18px;text-align:center;font-size:13px;color:var(--text-2);width:170px;flex:none}
.day-card svg.i{width:28px;height:28px;color:var(--orange);margin-bottom:4px}

.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:19px}
.card-h .count{color:var(--text-2);font-family:var(--sans);font-size:14px;font-weight:400}
.card-h .ico{color:var(--primary)}
.card-h .ico.o{color:var(--orange)}
.card-h .more{margin-left:auto;border:0;background:none;color:var(--primary);font-size:13px;font-weight:500;padding:4px 6px;border-radius:8px}
.card-h .more:hover{background:var(--primary-light)}

/* goal */
.goal{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.goal-l{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rings{display:flex;gap:14px;align-items:center}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;text-align:center;line-height:1.1}
.ring .big{font-family:var(--serif);font-weight:600;color:var(--text)}
.ring .unit{font-size:12px;color:var(--text-2)}
.streak{display:grid;gap:8px;min-width:150px}
.streak-n{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:28px;font-weight:600}
.streak-n svg.i{width:26px;height:26px;color:var(--orange)}
.dots{display:grid;grid-template-columns:repeat(7,20px);gap:5px}
.dot{width:20px;height:20px;border-radius:50%;background:var(--track);display:grid;place-items:center;color:#fff}
.dot svg.i{width:12px;height:12px;stroke-width:3}
.dot.active{background:color-mix(in srgb,var(--primary) 45%,var(--track))}
.dot.met{background:var(--primary)}
.dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--primary)}
.dot.future{background:transparent;border:1.5px dashed var(--border)}
.dlabels{display:grid;grid-template-columns:repeat(7,20px);gap:5px;font-size:11px;color:var(--text-2);text-align:center}
.goal-note{font-size:13px;color:var(--text-2);margin-top:2px}
.goal-note.ok{color:var(--primary);font-weight:500}
.edit-goal{border:1px solid var(--border);background:var(--surface);padding:3px 10px;border-radius:999px;font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--text-2);margin-left:6px}
.edit-goal svg.i{width:13px;height:13px}
.log-col{display:grid;gap:10px;align-content:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;padding:10px 16px;font-weight:600;font-size:14px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-alt)}
.btn-big{padding:16px 18px;font-size:17px;font-family:var(--serif);font-weight:600;border-radius:14px}
.btn-big svg.i{width:22px;height:22px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 6px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--text-2)}
.quick button svg.i{width:22px;height:22px;color:var(--primary)}
.quick button:hover{border-color:var(--primary);color:var(--text)}

/* books */
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.shelf.all{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bk{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:1fr auto;gap:10px}
.cover{width:72px;aspect-ratio:2/3;border-radius:4px 7px 7px 4px;position:relative;overflow:hidden;color:#fff;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(15,23,42,.18)}
.cover .ct{font-family:var(--serif);font-size:11px;line-height:1.15;font-weight:600}
.cover .ca{font-size:8.5px;opacity:.85}
.cover .fmt{position:absolute;right:4px;bottom:4px;opacity:.9;z-index:1}
.cover .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .fmt svg.i{width:13px;height:13px}
.bk-t{font-weight:600;font-size:14px;line-height:1.3}
.bk-a{font-size:12px;color:var(--text-2)}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin:8px 0 3px}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:999px}
.bk-meta{font-size:12px;color:var(--text-2)}
.hint{font-size:12px;color:var(--primary);font-weight:500;margin-top:2px}
.bk-actions{grid-column:1/-1;display:flex;gap:6px;margin-top:8px}
.bk-actions .btn{padding:6px 10px;font-size:12px;border-radius:9px;flex:1}
.more-btn{border:1px solid var(--border);background:var(--surface);border-radius:9px;width:32px;display:grid;place-items:center;color:var(--text-2)}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.split>.card{border-radius:0}
.split>.card:first-child{border-radius:16px 0 0 16px;border-right:0}
.split>.card:last-child{border-radius:0 16px 16px 0}
.paused{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-alt);border-radius:12px;padding:12px 8px;text-align:center}
.stat svg.i{color:var(--primary);width:22px;height:22px}
.stat .n{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;margin-top:4px}
.stat .l{font-size:12px;color:var(--text-2)}
.stat.o svg.i{color:var(--orange)}

/* challenges */
.ch{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0}
.ch+.ch{border-top:1px solid var(--border)}
.ch .ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.ch .ci svg.i{width:15px;height:15px}
.ch .nm{font-size:14px;font-weight:500}
.ch .vl{font-size:12px;color:var(--text-2);text-align:right}
.ch .bar{grid-column:2/4;margin:2px 0 0}

/* trophies */
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.trophy svg.hex{width:72px;height:80px}
.trophy .tn{font-weight:600;font-size:13px;margin-top:4px}
.trophy .td{font-size:11px;color:var(--text-2)}

/* activity */
.act{padding:10px 0}
.act+.act{border-top:1px solid var(--border)}
.act-top{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:start}
.act-txt{font-size:14px;line-height:1.35}
.act-txt em{font-family:var(--serif);font-style:italic}
.act-when{font-size:12px;color:var(--text-2);white-space:nowrap}
.reacts{display:flex;flex-wrap:nowrap;gap:6px;margin:8px 0 0}
.react{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 8px;font-size:12px;display:inline-flex;gap:5px;align-items:center;color:var(--text-2)}
.react:hover:not(:disabled){border-color:var(--primary)}
.react[aria-pressed="true"]{background:var(--primary-light);border-color:var(--primary);color:var(--primary);font-weight:600}
.react:disabled{cursor:default;opacity:.8}
.react .em{font-size:14px}
.react{min-width:44px;justify-content:center}
.cover-btn{border:0;padding:0;background:none;text-align:left;border-radius:7px;align-self:start}
.t-btn{border:0;padding:0;background:none;text-align:left;font:inherit;color:inherit}
.t-btn:hover .bk-t{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.bk.sel .cover{outline:3px solid var(--primary);outline-offset:3px}
.detail{margin-top:18px;border:1px solid var(--border);border-radius:14px;background:var(--bg);padding:18px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px}
.detail .cover{width:110px;padding:12px 10px}
.detail .cover .ct{font-size:16px}
.detail .cover .ca{font-size:10px}
.d-top{display:flex;gap:10px;align-items:flex-start}
.d-top .icon-btn{margin-left:auto}
.d-kicker{font-size:12px;font-weight:600;color:var(--primary)}
.d-title{font-size:26px;line-height:1.15}
.d-prog{display:flex;justify-content:space-between;font-size:14px;margin-top:14px}
/* F1: no length yet. */
.len-none{color:var(--text-2);font-size:13px}.len-none .link-btn{padding:0 2px;font-size:13px}.len-box{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-alt);display:grid;gap:2px}
.d-prog .len-none{text-align:right}
.detail .bar{height:9px}
.d-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.d-stat{background:var(--surface-alt);border-radius:10px;padding:10px 12px}
.d-stat .l{font-size:12px;color:var(--text-2)}
.d-stat .n{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2;white-space:nowrap}
.d-stat .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-left{gap:8px!important}.side-acts{gap:3px!important}.side-acts .sa{gap:5px}
.d-stat .n small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--text-2)}
.d-stat .n.accent{color:var(--primary)}
.d-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:14px}
.link-btn{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--primary);font-weight:500;font-size:14px;padding:8px 10px;border-radius:9px}
.link-btn:hover{background:var(--primary-light)}
.privacy-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-alt);font-size:13px;color:var(--text-2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.privacy-note button{border:0;background:none;color:var(--primary);font-weight:600;font-size:13px;padding:0}

/* empty */
.empty{text-align:center;padding:18px 10px;color:var(--text-2)}
.empty svg.i{width:40px;height:40px;color:var(--secondary);stroke-width:1.4}
.empty h3{font-size:16px;color:var(--text);margin:8px 0 4px}
.empty p{margin:0 auto 12px;font-size:13px;max-width:34ch}

/* placeholder pages */
.ph{max-width:620px;margin:40px auto;text-align:center}
.ph svg.i{width:44px;height:44px;color:var(--primary)}
.ph h1{font-size:30px;margin:10px 0 6px}
.ph ul{text-align:left;display:inline-block;margin:14px 0;color:var(--text-2)}

/* bottom nav */
.bnav{display:none}

/* dialog */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 24px 60px rgba(15,23,42,.3)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg{padding:20px 22px}
/* Small phones: the standard 16 px side margin in windows, which also gives the book details tabs room for "Copies (1)" at 360 px. */
@media (max-width:400px){.dlg{padding-left:16px;padding-right:16px}}
.dlg-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.dlg-h h2{font-size:21px}
.dlg-h .x{margin-left:auto}
.dlg .cover{width:58px;font-size:9px}
.form{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f2 .inp,.f3 .inp{min-width:0;width:100%;box-sizing:border-box}
.f3>label.f{white-space:nowrap;min-width:0}@media (max-width:400px){.f3{gap:6px}.f3 .inp{padding-left:9px;padding-right:4px}}.f3 .min-hint{white-space:normal}
label.f{display:grid;gap:5px;font-size:13px;font-weight:500}
label.f .sub{font-weight:400;color:var(--text-2)}

}

/* dashboard grid */

.tabs>.tab[aria-selected="true"]{background:none;color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

.board{--row:236px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 3px;overflow:visible;min-height:0;padding:20px 18px 0;border-radius:4px 4px 0 0;
  background-color:var(--wall);background-image:repeating-linear-gradient(to bottom,transparent 0 var(--row),var(--plank-top) var(--row) calc(var(--row) + 3px),var(--plank) calc(var(--row) + 3px) 100%);background-size:100% calc(var(--row) + 16px);background-origin:content-box;
  border:10px solid var(--plank);border-top-width:12px;border-bottom-width:18px;box-shadow:inset 0 10px 18px -10px var(--plank-shadow),0 6px 14px -8px var(--plank-shadow)}
/* Spines: decorations live only in the head and tail; each decoration sets the padding so lettering always sits in the clear space between. */
.spine{width:var(--w);height:var(--h);margin-top:calc(var(--row) - var(--h));position:relative;overflow:hidden;justify-content:flex-start;gap:9px;padding:12px 0;border-radius:2px 2px 0 0;color:var(--ink);text-orientation:sideways;
  --gold:#C9A75A;--base:linear-gradient(90deg,color-mix(in srgb,var(--sb) 70%,#000) 0,var(--sb) 16%,color-mix(in srgb,var(--sb) 95%,#fff) 48%,var(--sb) 80%,color-mix(in srgb,var(--sb) 68%,#000) 100%);background-color:var(--sb);background-image:var(--base)}

.spine .sp-t .l{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine .sp-a{position:relative;z-index:1;flex:0 1 auto;min-height:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:1;font-family:var(--sans);font-size:9.5px;letter-spacing:.04em}

.fn-linen{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 4px,rgba(255,255,255,.03) 4px 5px,transparent 5px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 5px),var(--base)}
.fn-pebbled{background-image:radial-gradient(circle at 1.5px 1.5px,rgba(0,0,0,.2) 0 1px,transparent 1.5px),radial-gradient(circle at 3.5px 3.5px,rgba(255,255,255,.035) 0 .9px,transparent 1.3px),var(--base);background-size:4px 4px,5px 5px,auto}
/* Decorations, head and tail only */
.dk-bands{padding:23px 0}
.dk-bands::before,.dk-bands::after{content:"";position:absolute;left:2px;right:2px;height:7px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.dk-bands::before{top:8px}.dk-bands::after{bottom:8px}
.dk-silver{padding:23px 0}

.dk-silver::before{top:8px}.dk-silver::after{bottom:8px}
.dk-thinthick{padding:26px 0}
.dk-thinthick::before,.dk-thinthick::after{content:"";position:absolute;left:2px;right:2px;height:9px}
.dk-thinthick::before{top:8px;border-top:1.5px solid var(--gold);background:linear-gradient(180deg,transparent 0 3px,var(--gold) 3px)}
.dk-thinthick::after{bottom:8px;border-bottom:1.5px solid var(--gold);background:linear-gradient(0deg,transparent 0 3px,var(--gold) 3px)}
.dk-ribs{padding:30px 0}
.dk-ribs::before,.dk-ribs::after{content:"";position:absolute;left:0;right:0;height:16px;background:linear-gradient(180deg,rgba(255,255,255,.16) 0 1.5px,rgba(0,0,0,.08) 1.5px 3.5px,rgba(0,0,0,.42) 3.5px 5px,transparent 5px 11px,rgba(255,255,255,.16) 11px 12.5px,rgba(0,0,0,.08) 12.5px 14.5px,rgba(0,0,0,.42) 14.5px 16px,transparent 16px)}
.dk-ribs::before{top:7px}.dk-ribs::after{bottom:7px}
.dk-band{padding:24px 0}
.dk-band::before,.dk-band::after{content:"";position:absolute;left:0;right:0;height:8px;background:rgba(0,0,0,.38);box-shadow:0 -1px 0 rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.07)}
.dk-band::before{top:9px}.dk-band::after{bottom:9px}
.dk-diamond{padding-top:28px}
.dk-diamond::before{content:"";position:absolute;left:50%;top:11px;width:7px;height:7px;margin-left:-3.5px;background:var(--gold);transform:rotate(45deg)}
.dk-headtail{padding:19px 0}
.dk-headtail::before,.dk-headtail::after{content:"";position:absolute;left:0;right:0;height:10px;background:rgba(0,0,0,.45)}

.req-btns{display:flex;gap:6px;flex-wrap:wrap}
.notif{flex-wrap:wrap}.notif-req{flex-basis:100%;margin-top:2px}
.has-acts{position:relative}.card-acts{position:absolute;top:10px;right:10px;display:flex;gap:2px;z-index:1}
.card-acts .link-btn{color:var(--text-2)}.card-acts .link-btn:hover{color:var(--primary)}
.has-acts .chc-open{padding-right:64px}
.mk-n{position:absolute;top:4px;left:4px;width:7px;height:7px;border-radius:2px;background:var(--purple);box-shadow:0 0 0 1.5px var(--card)}
.cal-legend .mk-n.lg-n{position:static;display:inline-block;margin-right:5px;box-shadow:none}
.note-add{margin-left:auto}
.hgrid .card-h{flex-wrap:wrap;row-gap:6px}
.notes-list{display:grid;gap:8px;margin-bottom:12px}
.note-i{border-left:3px solid var(--purple);background:var(--surface-alt);border-radius:0 10px 10px 0;padding:8px 12px}
.note-i p{margin:4px 0 0;white-space:pre-wrap}
.clamped{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,4);line-clamp:var(--lines,4);overflow:hidden}
.char-count{margin-top:4px}
.draft-note{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between;margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--primary-light);color:var(--text)}.char-count.near{color:#B45309;font-weight:600}
.more-t{padding:2px 0;margin-top:2px}.more-t[hidden]{display:none}
/* Text people type can be one long unbroken string; let it wrap inside its box instead of widening the page. */
.note-i,.note-i p,.sess-note,.act-txt,.notif p,.rec,.fr-txt,.aw-t,.chc-t,.lc-t,.pick-t,.selc-t,.tn,.td,.bd-h h2,#chTitle,#chBody p,.b-row .small,.req-in .small,.toast,.st,.joined{overflow-wrap:anywhere;min-width:0}
.hgrid>*,.dgrid>*,.ch-grid>*,.b-list>*,.sess,.sess-day{min-width:0}
.up-pick,.up-pick .small,.up-pick b,.un-t,.un-a,.d-title,.mini-t,.bk-a,.pb-t,.paused *,.hero2 h1{overflow-wrap:anywhere;min-width:0}
.cr-foot>.up-pick{max-width:240px}@media (max-width:720px){.cr-foot>.up-pick{max-width:none}}
.note-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.note-h svg.i{width:12px;height:12px;margin-right:4px;vertical-align:-1px}
.gs{margin:22px 0 4px}
.gs-list{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.gs-i{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.gs-c{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--primary-light);color:var(--primary)}
.gs-c svg.i{width:17px;height:17px}
.gs-i.done .gs-c{background:var(--primary);color:var(--on-primary)}
.gs-i.done b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent)}
.gs-t{flex:1;min-width:0;display:grid;gap:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.b-confirm{margin-top:14px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--red) 35%,var(--border));border-radius:12px;background:color-mix(in srgb,var(--red) 6%,var(--surface));display:grid;gap:10px}
.b-confirm .acts{display:flex;flex-wrap:wrap;gap:8px}
.yir-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 4px}
.yir-tile{display:grid;gap:2px;padding:14px;border-radius:14px;background:var(--surface-alt);border:1px solid var(--border)}
.yir-tile b{font-family:var(--serif);font-size:32px;line-height:1.1}
.yir-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.yir-sec h3{font-family:var(--serif);font-size:19px;margin:0 0 6px}
.yir-rated{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 10px}
.yir-book{display:grid;gap:4px;justify-items:start;text-align:left;border:0;background:none;padding:0;color:inherit}
body:has(.menu:not([hidden])) .tour-offer{display:none}
.acct-pic{display:flex;gap:14px;align-items:center}
.acct-av{width:64px;height:64px;font-size:26px;flex:none}
.acct-colors{display:flex;flex-wrap:wrap;gap:6px}
.acct-colors button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);padding:0}
.acct-colors button[aria-checked="true"]{box-shadow:0 0 0 2px var(--text)}
.btn-del{background:#B42318;color:#fff}.btn-del:hover{background:#912018}.btn-del:disabled{opacity:.45;cursor:not-allowed}
.b-hidden-t{justify-self:start}
.inv-box{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;border-radius:12px;background:var(--primary-light)}

/* hero without a border */
.hero2{border:0}
/* up next inside Currently Reading */
.cr-foot{display:flex;align-items:stretch;gap:20px;margin-top:14px}
.cr-foot .minis{flex:1;min-width:0;margin-top:0}
.up-pick{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-left:20px;border-left:1px solid var(--border)}
.cr-foot>.up-pick:first-child{padding-left:0;border-left:0}
.up-pick .cover{width:64px}
@media (max-width:720px){.cr-foot{flex-direction:column}.up-pick{padding-left:0;border-left:0;border-top:1px solid var(--border);padding-top:14px;flex-direction:row;flex-wrap:wrap;align-items:center}.up-pick>.small{flex-basis:100%}}
/* bookends: one alignment for every label and count */
.bookend,.bookend.long{justify-content:flex-start;padding-top:16px;gap:0}
.be-orn,.bookend.long .be-orn{display:none}
.be-l{height:94px;justify-content:center}
.bookend.long .be-l{height:94px;max-height:94px;display:block;text-align:center}
.be-n{position:absolute;left:0;right:0;bottom:18px;text-align:center}

/* hero contained to the layout width */
.hero2{margin:0;border:0;border-radius:16px;overflow:hidden}
.hero2-in{max-width:none;padding:40px 44px 36px}
.hero-photo-btn{right:16px;bottom:14px}
@media (max-width:720px){.hero2{border-radius:14px}.hero2-in{padding:22px 18px 52px}.hero-photo-btn{right:12px;bottom:12px}}
/* long bookend labels */
.bookend.long{padding-top:16px;gap:6px}
.bookend.long .be-orn{display:none}
.bookend.long .be-l{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;line-height:1.15;max-height:104px;overflow:hidden;text-align:center;display:block}

/* hero over a full-width scene (photo optional) */
.hero2{--scene:var(--hero-scene);position:relative;
  background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 34%,color-mix(in srgb,var(--bg) 80%,transparent) 52%,color-mix(in srgb,var(--bg) 25%,transparent) 72%,transparent 92%),var(--user-hero,var(--scene));background-size:cover;background-position:center right;border:0}
.hero2-in{grid-template-columns:minmax(0,640px);min-height:340px;align-content:center}
.hero-photo-btn{position:absolute;right:max(20px,calc(50% - 600px));bottom:16px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(4px)}
.hero-photo-btn svg.i{width:15px;height:15px}
.hero-photo-btn:hover{background:var(--surface)}
.hero2:not(.has-photo) .hero-photo-btn{color:var(--text-2)}
/* compact Up Next */
.un-row{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:14px 12px}
.un-b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:static}
.un-b .cover-btn .cover{width:64px}
.un-t{font-size:12.5px;line-height:1.25;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.un-a{font-size:11.5px;color:var(--text-2)}
.un-n{width:17px;height:17px;font-size:10px;margin-right:4px}
.un-acts{display:flex;gap:2px;margin:2px 0 0 -6px}
.un-acts .icon-btn{padding:4px}
.un-acts svg.i{width:15px;height:15px}
/* brass bookends */
.plate:not(:first-child){margin-left:10px}
.plate{padding:0 5px}
.bookend{position:relative;width:46px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding-top:22px;border-radius:23px 23px 2px 2px;
  background:linear-gradient(90deg,#8E6A2C 0%,#D9B66A 22%,#F1DB9F 42%,#C9A04F 62%,#8E6A2C 100%);box-shadow:inset 0 0 0 3px rgba(255,240,200,.35),inset 0 0 0 4px rgba(90,60,20,.35),0 4px 8px var(--plank-shadow)}
.bookend::after{content:"";position:absolute;left:-4px;right:-4px;bottom:0;height:8px;border-radius:2px;background:linear-gradient(180deg,#B08A43,#7A5A24)}
.be-l{font-family:var(--serif);font-weight:700;font-size:14px;color:#3B2A0C;line-height:1;display:flex;flex-direction:column;align-items:center;text-shadow:0 1px 0 rgba(255,245,215,.6)}
.be-l i{font-style:normal;font-weight:400;font-size:11px;line-height:.9}
.be-orn{width:16px;height:16px;transform:rotate(45deg);border:2px solid rgba(59,42,12,.55);border-radius:2px}
.be-n{font-size:11px;font-weight:600;color:#3B2A0C;opacity:.8}
.flat{height:var(--fh,26px)}
@media (max-width:720px){
  .hero2{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent) 0%,color-mix(in srgb,var(--bg) 88%,transparent) 45%,var(--bg) 100%),var(--user-hero,var(--scene));background-size:cover;background-position:center}
  .hero2-in{min-height:0;padding-bottom:56px}
  .hero-photo-btn{right:14px;bottom:12px}
}
/* Phones: the dashboard photo is set from the account menu, so the hero doesn't hold space for its button. */
@media (max-width:720px){.hero-photo-btn{display:none}.hero2-in{padding-bottom:22px}}


.plate{height:var(--row);display:flex;align-items:flex-end;padding:0 6px;scroll-margin-top:90px}
.plate:not(:first-child){margin-left:14px}
.plate-c{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:8px;height:128px;width:34px;justify-content:center;background:var(--surface);border:1px solid color-mix(in srgb,var(--plank) 55%,var(--border));border-radius:4px 4px 0 0;box-shadow:0 2px 6px var(--plank-shadow)}
.plate-l{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--text);white-space:nowrap}
.plate-n{font-size:11px;color:var(--text-2)}
.d-stat{background:none;border-left:1px solid var(--border);border-radius:0;padding:2px 0 2px 12px}
.trophy .tn,.tw .tn{overflow-wrap:anywhere}

/* Discover */
.disc{display:grid;gap:34px}
.disc>.lib-h{margin-bottom:-14px}
.dc-find,.dc-have,.dc-recs{display:grid;gap:22px;min-width:0}
.dc-sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:22px}
.dc-sec-h h2{font-size:24px;font-weight:600;display:flex;align-items:center;gap:8px}
.dc-find .dc-row:first-child .dc-rh{border-top:1px solid var(--border);padding-top:22px}
.dc-row{min-width:0}
.dc-h{font-size:17px;font-weight:600;margin:0 0 12px}
.dc-rh{display:flex;align-items:baseline;gap:8px}
.dc-rh .link-btn svg.i{width:14px;height:14px}
.dc-scroll{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.dc-three{grid-template-columns:repeat(3,minmax(0,1fr))}
.ser-list{display:grid;gap:14px}
.ser-card{display:grid;gap:10px;padding:16px;min-width:0}
.ser-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ser-h h3{margin:0;font-family:var(--serif);font-size:20px}
.ser-bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--border) 70%,transparent);overflow:hidden}
.ser-bar span{display:block;height:100%;background:var(--primary)}
.ser-books{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ser-b{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:8px;color:inherit;min-width:0}
.ser-b:hover{border-color:var(--primary)}
.ser-t{display:grid;gap:1px;min-width:0}
.ser-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.ser-s{color:var(--text-2)}.ser-s.finished{color:var(--primary);font-weight:600}.ser-s.reading,.ser-s.paused{color:var(--text);font-weight:600}
.ser-gap{align-self:center;padding:4px 2px}
.ns{display:grid;gap:8px;max-width:640px}
.ns-res:empty{display:none}.ns-res{display:grid;gap:8px}
.ns-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ns-i{display:grid;gap:3px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;color:inherit;min-width:0;overflow-wrap:anywhere}
.ns-i:hover{border-color:var(--primary)}

.f[hidden],#startLenHint[hidden]{display:none}
.ch-pace{color:var(--primary);font-weight:600;margin-top:2px}
.lcard.dc-ghost{position:relative;border-style:dashed}

function bookStats(b){
  const t=today(),audio=b.format==='audio',ss=S.sessions.filter(s=>s.bookId===b.id&&!isCU(s));
  const left=hasLen(b)?Math.max(0,b.total-b.pos):null;
  let per=null;
  if(audio){const m=ss.map(s=>s.minutes||s.est||0).filter(x=>x>0);if(m.length)per=m.reduce((a,x)=>a+x,0)/m.length}
  else{const own=ss.filter(s=>s.pages>0).map(s=>s.pages),all=S.sessions.filter(s=>s.pages>0&&!isCU(s)).map(s=>s.pages);const use=own.length>=2?own:all;if(use.length)per=use.reduce((a,x)=>a+x,0)/use.length}
  const toGo=per&&left!=null?Math.ceil(left/per):null;
  const days=new Set(ss.filter(s=>s.date>addDays(t,-14)).map(s=>s.date)).size;
  const reading=Math.max(1,S.books.filter(x=>x.status==='reading').length);

  const finish=toGo&&rate?addDays(t,Math.ceil(toGo/rate)):null;

const openNotes=new Set();
function clampNotes(){
  document.querySelectorAll('.clampable').forEach(el=>{
    const k=el.dataset.clamp,open=openNotes.has(k),btn=el.parentElement.querySelector(`[data-act=noteMore][data-v="${k}"]`);
    el.classList.toggle('clamped',!open);
    const cut=!open&&el.scrollHeight>el.clientHeight+1;
    if(btn){btn.hidden=!(cut||open);btn.textContent=open?'Show Less':'Show More';btn.setAttribute('aria-expanded',open)}
  });
}

  S.sessions.forEach(x=>{if(!hit(x.note))return;const b=book(x.bookId);out.push({kind:'sess',text:x.note,where:`Session note · ${fmtDateY(x.date)}${b?` · ${ti(b.title)}`:''}`,act:`data-act="notesGo" data-v="${x.date}"`,sort:x.date})});
  (S.journal||[]).forEach(n=>{if(hit(n.text))out.push({kind:'cal',text:n.text,where:`Calendar note · ${noteRange(n)}`,act:`data-act="notesGo" data-v="${n.start}"`,sort:n.start})});

function mySeries(){
  const mine=new Set(baseList().map(t=>t.id)),by={};
  S.titles.forEach(t=>{if(t.series&&t.seriesNo!=null)(by[t.series]=by[t.series]||[]).push(t)});
  // only my books, plus a book someone in my group shares a copy of when I don't already have that number (no leftovers or duplicates)
  Object.keys(by).forEach(sn=>{const nums=new Set(by[sn].filter(t=>mine.has(t.id)).map(t=>+t.seriesNo));
    by[sn]=by[sn].filter(t=>mine.has(t.id)||(sharedCopiesOf(t.id).length&&!nums.has(+t.seriesNo)))});
  return Object.keys(by).filter(sn=>by[sn].some(t=>mine.has(t.id))).map(sn=>{
    const ts=by[sn].sort((a,b)=>a.seriesNo-b.seriesNo||sortKey(a.title).localeCompare(sortKey(b.title)));
    const st=t=>myReading(t.id)?.status||(copiesOf(t.id).some(c=>c.owner==='me')?'owned':'none');
    const done=ts.filter(t=>st(t)==='finished').length,len=Math.max(S.seriesLen?.[sn]||0,Math.ceil(ts[ts.length-1].seriesNo),ts.length);
    const cur=ts.find(t=>st(t)==='reading'||st(t)==='paused'),next=cur||ts.find(t=>!['finished','dnf'].includes(st(t))&&!hiddenT(t));
    return {sn,ts,st,done,len,cur,next,complete:done>=len}});
}

function fitSpines(){

/* Books next to empty space lean: at the end of a row a book tips against its neighbor or slides over to lean on the wall,
   and a book beside a flat stack leans onto it. Angles come from the measured layout so a book touches what it leans on

function leanSpines(){
  const board=document.querySelector('.board');if(!board)return;
  const kids=[...board.children];
  kids.forEach(el=>{if(el.classList.contains('spine')){el.style.rotate='';el.style.translate='';el.style.transformOrigin=''}});
  const bs=getComputedStyle(board),B=board.getBoundingClientRect(),wall=B.right-parseFloat(bs.borderRightWidth);
  const rows=[];let prevLeft=Infinity;
  kids.forEach(el=>{const r=el.getBoundingClientRect();if(!r.width)return;if(r.left<prevLeft-1)rows.push([]);rows[rows.length-1].push({el,r});prevLeft=r.left});

  const topOf=x=>{const be=x.el.querySelector('.bookend');return (be||x.el).getBoundingClientRect().top};
  const flats=x=>[...x.el.querySelectorAll('.flat')].map(f=>f.getBoundingClientRect());
  const lean=(x,side,th,dx)=>{x.el.style.transformOrigin=side==='left'?'left bottom':'right bottom';x.el.style.rotate=(side==='left'?-th:th).toFixed(2)+'deg';x.el.style.translate=dx.toFixed(1)+'px 0';x.leaned=true};
  rows.forEach(row=>{

      if(next&&next.el.classList.contains('stack')&&!(prev&&prev.el.classList.contains('stack'))&&pick(21,2)===0){

        if(th>=3)lean(x,'right',Math.min(th,16),0);return;
      }
      if(prev&&prev.el.classList.contains('stack')&&next&&pick(22,2)===0){
        const th=Math.min(...flats(prev).map(f=>Math.atan2(x.r.left-f.right-1.5,bottom-f.top)))/deg;
        if(th>=3)lean(x,'left',Math.min(th,16),0);return;
      }

      if(i!==row.length-1)return;

/* Ghost card after Not for Me: the card stays in place, faded, with Hidden · Undo (and, for a recommendation, who

function ghostCard(card,k,sub,kb,opt={}){

  [...card.children].forEach(c=>c.inert=true);card.classList.add('dc-ghost');

    if(had&&rowId){const cs=document.getElementById(rowId)?.closest('.dc-row')?.querySelectorAll('.dc-card');const c=cs?.[Math.min(idx,cs.length-1)];(c?.querySelector('.dc-nfm')||c?.querySelector('.lc-open'))?.focus({preventScroll:true})}};

/* Outside clicks close the windows you read (book, challenge, and Battle of the Books details), never the forms
   you type into. Mouse and trackpad only: a finger or pen tap outside never closes a window. A text box in use
   takes the first outside click (it just leaves the box); an unsent borrow note or reply note blocks it. */
let downOut=null;

const typingIn=d=>{const a=document.activeElement;return a&&d.contains(a)&&a.matches('textarea,select,input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit])')?a:null};

  const o=downOut;downOut=null;
  if(!o||e.target!==o.d||!outsideOf(o.d,e)||o.type!=='mouse'||!closesOutside(o.d))return;
  if([...o.d.querySelectorAll('#reqNoteTx,.req-reply textarea')].some(x=>x.value.trim()))return;// unsent note: do nothing
  if(o.typing){o.typing.blur();return}// first outside click just leaves the box
  o.d.close();

/* Tab rows that don't fit (book details on phones, the Library's tabs on small phones) show a soft fade and a

   The selected tab is kept in view. */
function tabEdges(root=document){
  root.querySelectorAll('.bd-tabs,.tabs[role=tablist]').forEach(row=>{
    let w=row.parentElement;
    if(!w.classList.contains('tab-wrap')){w=document.createElement('div');w.className='tab-wrap'+(row.closest('dialog')?' in-dlg':'');row.replaceWith(w);w.appendChild(row);
      w.insertAdjacentHTML('beforeend','<button type="button" class="tab-more l" tabindex="-1" aria-hidden="true">‹</button><button type="button" class="tab-more r" tabindex="-1" aria-hidden="true">›</button>');
      w.querySelectorAll('.tab-more').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();row.scrollBy({left:(b.classList.contains('r')?1:-1)*row.clientWidth*.7,behavior:reducedMotion()?'auto':'smooth'})}));
      row.addEventListener('scroll',()=>edgeState(w,row),{passive:true});
      const sel=row.querySelector('[aria-selected=true]');
      if(sel&&(sel.offsetLeft+sel.offsetWidth>row.scrollLeft+row.clientWidth||sel.offsetLeft<row.scrollLeft))row.scrollLeft=sel.offsetLeft-24;

/* ---------- book descriptions (2i) ----------
   Sources in order: one a member wrote in Edit Book, then the Open Library work record (fetched with the work key
   and saved on the title). Google Books, the third source, waits until its terms have been read. */
function cleanDesc(raw){
  let s=raw&&typeof raw==='object'?raw.value:raw;if(typeof s!=='string')return '';
  s=s.replace(/\r/g,'');
  // Open Library often adds a divider, then "Contains" or "See also" lists: keep only the description above it.
  const parts=s.split(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/m);if(parts.length>1&&parts[0].trim().length>=60)s=parts[0];
  s=s.replace(/^\s*\[\d+\]:\s*\S+.*$/gm,'')                 // reference-link definitions
     .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')                  // [text](url)
     .replace(/\[([^\]]+)\]\[\d*\]/g,'$1')                   // [text][1]
     .replace(/\(\s*(?:source|from)\b[^)]*\)/gi,'')            // (source: ...)
     .replace(/^\s*(?:see also\b|source:|also contained in\b).*$/gim,'')
     .replace(/https?:\/\/\S+/g,'')
     .replace(/(\*\*|__)(.+?)\1/g,'$2')
     .replace(/(^|[\s(“"'])([*_])(\S(?:[^*_\n]*?\S)?)\2(?=[\s).,;:!?”"']|$)/gm,'$1$3')   // *emphasis* and _emphasis_
     .replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  return s.replace(/\s+/g,' ').length<60?'':s;   // a few words or just a credit: not a description
}

/* Google Books, the third source: only when there's no member or Open Library description, fetched when the
   book's details open, and never saved (Google's terms). Shown unaltered apart from formatting, with the
   "powered by Google" image and a prominent link to the book's Google Books page. */

   accepts it from gravityoptional.github.io and only for the Books API. country: Google needs it to answer. */
const GB_KEY='AIzaSyAd_Iod-Yx6TgTKYHKcW-16tk36UnALHdE',GB_COUNTRY='US';
function gbSafe(raw){

  const doc=new DOMParser().parseFromString(`<div>${raw}</div>`,'text/html'),ok={P:'p',BR:'br',B:'b',STRONG:'b',I:'i',EM:'i'};

    if(r.ok){

const SMALLW=new Set('a an and as at but by for from in into nor of on onto or over per the to up via vs with'.split(' '));

/* Your latest rating of a book, if any. */
const myRating=tid=>S.books.filter(b=>b.titleId===tid&&b.status==='finished'&&b.rating).map(b=>b.rating).pop()||0;
/* In the recommend forms: include your rating. When you share your activity it's already visible, so it's
   included; when you don't, it's an opt-in for just these people, off by default. */
/* A finished book you haven't rated shows optional stars here; once rated, the include option appears in their place. */
function recRateOpt(t,id,stars=true){
  const rt=myRating(t.id);
  if(!rt){const fb=stars&&S.books.filter(b=>b.titleId===t.id&&b.status==='finished').pop();return fb?`<div class="nx-rate rec-rate" data-rbox="${id}">${starsFor(fb)}<span class="xs muted">Rate it to include your rating (optional)</span></div>`:''}
  return S.settings.share?`<div class="xs muted" id="${id}" data-on="1">Your rating (${rt}★) is included, since you share your activity.</div>`
    :`<label class="chk xs"><input type="checkbox" id="${id}"> Include my rating (${rt}★) <span class="muted">(only the people you choose see it)</span></label>`;
}
const recRateOn=id=>{const el=document.getElementById(id);return !!el&&(el.dataset.on==='1'||el.checked)};
/* How a recommendation's sender and rating read to the person receiving it. */
const recWho=r=>`${nameOf(r.from)}${r.rating?` (${r.rating}★)`:''}`;
/* Sends a recommendation to each chosen member who doesn't already have it; returns their names. The rating, when
   included, is a snapshot: changing it later doesn't change what was sent. */
function sendRec(t,to,note,withRating){
  const names=to.map(nameOf).join(', '),rating=withRating?myRating(t.id):0;
  to.filter(w=>!S.recsSent.some(r=>r.titleId===t.id&&r.to===w)).forEach(w=>S.recsSent.push({id:uid(),titleId:t.id,to:w,note,ts:Date.now(),...(rating?{rating}:{})}));
  if(S.settings.share)S.activity.push({id:uid(),who:'me',kind:'rec',text:'recommended',book:t.title,titleId:t.id,extra:`to ${names}`,ts:Date.now(),r:{}});
  return names;
}

const rateWho=()=>!S.settings.solo&&S.settings.share?'shared with your group':'only you see it';
/* Half-star rating control, used in book details and the finish window. */

function bdQuiet(t,r){

function renderBD(keepAll){

  const range=keepAll&&fk&&typeof fa?.selectionStart==='number'?{key:fk,start:fa.selectionStart,end:fa.selectionEnd,direction:fa.selectionDirection,top:fa.scrollTop,left:fa.scrollLeft}:null;
  const keep=bookBody.querySelector('.recf')?{to:[...bookBody.querySelectorAll('[name=recTo]:checked')].map(x=>x.value),note:document.getElementById('recNote')?.value||'',rate:!!document.getElementById('recRate')?.checked,focus:document.activeElement?.id||''}:null;

function bdFields(){return [...bookBody.querySelectorAll('input,select,textarea')].filter(e=>e.type!=='file'&&e.type!=='hidden'&&(e.id||e.name)).map(e=>{

  return changed?{key,v:e.value,c:e.checked,box:e.type==='checkbox'||e.type==='radio',top:e.scrollTop,left:e.scrollLeft,sel:e.tagName==='SELECT'}:null}).filter(Boolean)}

async function teSearchGB(){
  const q=te.q.trim(),id=te.id,editor=te;if(!q)return;
  teInvalidateSearch();const seq=teSearchSeq,ctl=new AbortController();teSearchCtl=ctl;
  const current=()=>te===editor&&teSearchSeq===seq&&te.id===id&&te.q.trim()===q&&titleDlg.open&&te.tab==='gb';
  te.gb={q,state:'loading',urls:[]};tePanel();
  try{const isbn=olIsbn(q);
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(isbn?'isbn:'+isbn:q)}&maxResults=30&printType=books&country=${GB_COUNTRY}&key=${GB_KEY}&fields=items(volumeInfo/imageLinks)`,{signal:ctl.signal});
    if(!r.ok)throw new Error('Google Books '+r.status);
    const urls=[...new Set(((await r.json()).items||[]).map(x=>x.volumeInfo?.imageLinks?.thumbnail).filter(Boolean).map(u=>u.replace(/^http:/,'https:').replace('&edge=curl','')))].slice(0,24);
    if(!current())return;te.gb={q,state:'done',urls};
  }catch(e){if(!current())return;te.gb={q,state:'error',urls:[]}}
  if(current())tePanel();
}
async function teSearch(){
  if(te.tab==='gb')return teSearchGB();
  const q=te.q.trim(),id=te.id,editor=te;if(!q)return;
  teInvalidateSearch();const seq=teSearchSeq,ctl=new AbortController();teSearchCtl=ctl;
  const current=()=>te===editor&&teSearchSeq===seq&&te.id===id&&te.q.trim()===q&&titleDlg.open&&te.tab==='ol';
  te.ol={q,state:'loading',ids:[]};tePanel();
  try{
    const isbn=olIsbn(q),ids=[],add=i=>{if(i>0&&!ids.includes(i))ids.push(i)};
    const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(isbn?'isbn:'+isbn:q)}&fields=key,cover_i&limit=8`,{signal:ctl.signal,headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error('Open Library '+r.status);
    const docs=(await r.json()).docs||[];if(!current())return;docs.forEach(d=>add(d.cover_i));
    if(docs[0]?.key){const e=await fetch(`https://openlibrary.org${docs[0].key}/editions.json?limit=50`,{signal:ctl.signal,headers:{Accept:'application/json'}});if(e.ok)((await e.json()).entries||[]).forEach(x=>(x.covers||[]).forEach(add))}
    if(!current())return;te.ol={q,state:'done',ids:ids.slice(0,24)};
  }catch(e){if(!current())return;te.ol={q,state:'error',ids:[]}}
  if(current())tePanel();
}
async function teUpload(file){

    const bmp=await createImageBitmap(file),sc=Math.min(1,300/bmp.width,450/bmp.height);
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);bmp.close?.();
    te.cover=cv.toDataURL('image/jpeg',.82);te.src='upload';te.bad=false;te.touched=true;document.getElementById('teErr').textContent='';tePreview();
  }catch(e){document.getElementById('teErr').textContent='That image couldn’t be opened. Try a different file.'}
}

async function coverFill(){

  try{
    const loved=new Set([...S.books.filter(b=>b.status==='finished'&&b.rating>=4).map(b=>b.titleId),...rereads().map(r=>r.id)]);
    const todo=S.titles.filter(t=>needCover(t)||needInfo(t)).sort((a,b)=>loved.has(b.id)-loved.has(a.id));
    for(const t of todo){
      if(!S.titles.includes(t)||!needCover(t)&&!needInfo(t))continue;
      const wantCover=needCover(t);
      const redo=!!t.olRedo;
      let d;try{d=await olCoverFor(t,redo)}catch(e){break}
      if(wantCover)t.coverTried=Date.now();
      t.olTried=Date.now();delete t.olRedo;

      const autoCover=t.cover&&/covers\.openlibrary\.org/.test(t.cover)&&!t.coverPicked;
      if(redo&&d?.m&&d.m.key!==t.olKey){delete t.olKey;if(autoCover){if(d.c)t.cover=`https://covers.openlibrary.org/b/id/${d.c.cover_i}-M.jpg`;else delete t.cover;coverRedraw()}}
      if(d?.c&&wantCover){t.cover=`https://covers.openlibrary.org/b/id/${d.c.cover_i}-M.jpg`;coverRedraw()}
      const m=d?.m||(!t.olKey&&d?.c);
      if(m)olSave(t,{key:m.key,authorKeys:(m.author_key||[]).slice(0,2),ebook:olEbook(m),...olFree(m)});
      if(m?.first_publish_year&&!t.year&&t.olKey===m.key)t.year=m.first_publish_year;
      if(redo&&d?.m)delete t.desc;// a corrected match fetches its own description

    }

}

function readLog(){

  const start=parse(f.start),end=parse(f.end);

function calcLog(){

    else if(isPct(b))parts.push(`Progress <b>${+span.toFixed(1)}%</b>${minutes&&!isNaN(minutes)?'':' (add minutes to count time)'}`);
    else{
      parts.push(`Pages read <b>${span}</b>`);
      if(minutes&&!isNaN(minutes)&&minutes>0)parts.push(`Speed <b>${Math.round(span/minutes*60)} pages/hr</b>`);
      else if(g.estimate&&span>0){const p=pace(b.id);if(p)parts.push(`About <b>${Math.round(span/p)} min</b> (estimated)`)}
    }
    if(hasLen(b)&&end>=b.total)parts.push(isPct(b)?`<b>That’s 100%.</b> Choose Finished if you’re done.`:`<b>That’s the end of the book!</b>`);
  }else parts.push(isPct(b)?'Progress <b>—</b>':'Pages read <b>—</b>');
  const mh=document.getElementById('minHint');if(mh)mh.textContent=minutes==null?'':isNaN(minutes)?'Try 90, 1:30, or 2h 30m':`= ${fmtMin(minutes)}`;

  if(start!=null&&end!=null&&!isNaN(start)&&!isNaN(end)&&end>=start){if(audio){if(g.estimate)addM=end-start}else if(!isPct(b))addP=end-start}
  if(minutes&&!isNaN(minutes))addM=minutes;else if(!audio&&addP&&g.estimate){const p=pace(b.id);if(p)addM=addP/p}
  const lbl=dt===today()?'Today':fmtDate(dt);
  if(cu){const fr=logForm.from.value,n=fr&&fr<=dt?daysIn(fr,dt):0;parts.push(n?`Catch-up for ${n} days: <b>${[addM?fmtMin(addM):'',addP?`${addP} pages`:''].filter(Boolean).join(', ')||'—'}</b>`:'Choose the first day it covers.');el.innerHTML=parts.map(p=>`<span>${p}</span>`).join('');return}
