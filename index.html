<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Room — Editorial Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7EE; --surface:#FDFAF0; --surface-alt:#F4F0E6; --card:#FDFAF0;
  --primary:#2E7D52; --primary-hover:#256746; --primary-light:#E8F4EC; --on-primary:#FFFFFF;
  --secondary:#6B7280; --text:#1F2937; --text-2:#6B7280; --border:#E6DCC6;
  --orange:#F97316; --green:#2E7D52; --red:#EF4444; --blue:#3B82F6; --purple:#8B5CF6;
  --track:#EDE8DA; --shadow:0 1px 2px rgba(31,41,55,.05);
  --hero-a:#F1EAD8; --hero-b:#E6DCC4; --shelf:#D8C9A8;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A; --surface:#1E293B; --surface-alt:#334155; --card:#1E293B;
    --primary:#34D399; --primary-hover:#10B981; --primary-light:#064E3B; --on-primary:#06281B;
    --secondary:#94A3B8; --text:#F8FAFC; --text-2:#94A3B8; --border:#334155;
    --orange:#FB923C; --green:#34D399; --track:#334155; --shadow:none;
    --hero-a:#1E293B; --hero-b:#16213A; --shelf:#475569; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1E293B; --surface-alt:#334155; --card:#1E293B;
  --primary:#34D399; --primary-hover:#10B981; --primary-light:#064E3B; --on-primary:#06281B;
  --secondary:#94A3B8; --text:#F8FAFC; --text-2:#94A3B8; --border:#334155;
  --orange:#FB923C; --green:#34D399; --track:#334155; --shadow:none;
  --hero-a:#1E293B; --hero-b:#16213A; --shelf:#475569; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.005em}
.muted{color:var(--text-2)}
.small{font-size:13px}
.xs{font-size:12px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--border)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--primary);background:none;border:0;padding:0}
.brand svg.i{width:24px;height:24px}
.nav{display:flex;gap:4px;margin-left:16px}
.nav button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--text-2);font-size:14px;font-weight:500}
.nav button[aria-current="page"]{background:var(--primary-light);color:var(--primary)}
.nav button:hover{color:var(--text)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.icon-btn{position:relative;border:0;background:none;padding:8px;border-radius:999px;color:var(--text-2);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-alt);color:var(--text)}
.badge-dot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.me-btn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 8px 4px 4px;border-radius:999px;font-size:14px;font-weight:500}
.me-btn:hover{background:var(--surface-alt)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(15,23,42,.14);padding:8px;z-index:20}
.menu[hidden]{display:none}
.menu h3{font-size:16px;padding:8px 10px 4px}
.menu .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px}
.menu .row:hover{background:var(--surface-alt)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .link{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14px}
.menu .link:hover{background:var(--surface-alt)}
.seg{display:inline-flex;background:var(--surface-alt);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:12px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.switch{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--border);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{left:19px}
.notif{padding:10px;border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.notif p{margin:0;font-size:14px}
.notif-go{border:0;background:none;padding:0;text-align:left;flex:1;color:inherit;border-radius:8px}
.notif-go:not([disabled]):hover p{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.notif.read p{color:var(--text-2)}
.notif .x{margin-left:auto}
.menu .notif{padding:12px 10px}
.menu .notif+.notif{border-top:1px solid color-mix(in srgb,var(--border) 75%,transparent);border-radius:0}

/* page */
main{max-width:1240px;margin:0 auto;padding:20px 20px 40px}
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(100deg,var(--hero-a) 0%,var(--hero-a) 45%,var(--hero-b) 100%);padding:26px 28px;display:flex;align-items:center;gap:20px;min-height:132px;background-size:cover;background-position:right center}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:46%;
  background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(46,125,82,.10) 14px 30px,transparent 30px 38px,rgba(180,140,80,.12) 38px 50px,transparent 50px 58px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 40%);mask:linear-gradient(90deg,transparent,#000 40%);pointer-events:none}
.hero-text{position:relative;z-index:1;flex:1}
.hero h1{font-size:32px;line-height:1.15}
.quote{margin:8px 0 0;color:var(--text-2);font-size:14px;max-width:46ch}
.day-card{position:relative;z-index:1;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:14px;padding:14px 18px;text-align:center;font-size:13px;color:var(--text-2);width:170px;flex:none}
.day-card svg.i{width:28px;height:28px;color:var(--orange);margin-bottom:4px}

.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:19px}
.card-h .count{color:var(--text-2);font-family:var(--sans);font-size:14px;font-weight:400}
.card-h .ico{color:var(--primary)}
.card-h .ico.o{color:var(--orange)}
.card-h .more{margin-left:auto;border:0;background:none;color:var(--primary);font-size:13px;font-weight:500;padding:4px 6px;border-radius:8px}
.card-h .more:hover{background:var(--primary-light)}

/* goal */
.goal{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.goal-l{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rings{display:flex;gap:14px;align-items:center}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;text-align:center;line-height:1.1}
.ring .big{font-family:var(--serif);font-weight:600;color:var(--text)}
.ring .unit{font-size:12px;color:var(--text-2)}
.streak{display:grid;gap:8px;min-width:150px}
.streak-n{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:28px;font-weight:600}
.streak-n svg.i{width:26px;height:26px;color:var(--orange)}
.dots{display:grid;grid-template-columns:repeat(7,20px);gap:5px}
.dot{width:20px;height:20px;border-radius:50%;background:var(--track);display:grid;place-items:center;color:#fff}
.dot svg.i{width:12px;height:12px;stroke-width:3}
.dot.active{background:color-mix(in srgb,var(--primary) 45%,var(--track))}
.dot.met{background:var(--primary)}
.dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--primary)}
.dot.future{background:transparent;border:1.5px dashed var(--border)}
.dlabels{display:grid;grid-template-columns:repeat(7,20px);gap:5px;font-size:11px;color:var(--text-2);text-align:center}
.goal-note{font-size:13px;color:var(--text-2);margin-top:2px}
.goal-note.ok{color:var(--primary);font-weight:500}
.edit-goal{border:1px solid var(--border);background:var(--surface);padding:3px 10px;border-radius:999px;font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--text-2);margin-left:6px}
.edit-goal svg.i{width:13px;height:13px}
.log-col{display:grid;gap:10px;align-content:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;padding:10px 16px;font-weight:600;font-size:14px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-alt)}
.btn-big{padding:16px 18px;font-size:17px;font-family:var(--serif);font-weight:600;border-radius:14px}
.btn-big svg.i{width:22px;height:22px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 6px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--text-2)}
.quick button svg.i{width:22px;height:22px;color:var(--primary)}
.quick button:hover{border-color:var(--primary);color:var(--text)}

/* books */
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.shelf.all{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bk{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:1fr auto;gap:10px}
.cover{width:72px;aspect-ratio:2/3;border-radius:4px 7px 7px 4px;position:relative;overflow:hidden;color:#fff;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(15,23,42,.18)}
.cover .ct{font-family:var(--serif);font-size:11px;line-height:1.15;font-weight:600}
.cover .ca{font-size:8.5px;opacity:.85}
.cover .fmt{position:absolute;right:4px;bottom:4px;opacity:.9;z-index:1}
.cover .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .fmt svg.i{width:13px;height:13px}
.bk-t{font-weight:600;font-size:14px;line-height:1.3}
.bk-a{font-size:12px;color:var(--text-2)}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin:8px 0 3px}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:999px}
.bk-meta{font-size:12px;color:var(--text-2)}
.hint{font-size:12px;color:var(--primary);font-weight:500;margin-top:2px}
.bk-actions{grid-column:1/-1;display:flex;gap:6px;margin-top:8px}
.bk-actions .btn{padding:6px 10px;font-size:12px;border-radius:9px;flex:1}
.more-btn{border:1px solid var(--border);background:var(--surface);border-radius:9px;width:32px;display:grid;place-items:center;color:var(--text-2)}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.split>.card{border-radius:0}
.split>.card:first-child{border-radius:16px 0 0 16px;border-right:0}
.split>.card:last-child{border-radius:0 16px 16px 0}
.paused{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-alt);border-radius:12px;padding:12px 8px;text-align:center}
.stat svg.i{color:var(--primary);width:22px;height:22px}
.stat .n{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;margin-top:4px}
.stat .l{font-size:12px;color:var(--text-2)}
.stat.o svg.i{color:var(--orange)}

/* challenges */
.ch{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0}
.ch+.ch{border-top:1px solid var(--border)}
.ch .ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.ch .ci svg.i{width:15px;height:15px}
.ch .nm{font-size:14px;font-weight:500}
.ch .vl{font-size:12px;color:var(--text-2);text-align:right}
.ch .bar{grid-column:2/4;margin:2px 0 0}

/* trophies */
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.trophy svg.hex{width:72px;height:80px}
.trophy .tn{font-weight:600;font-size:13px;margin-top:4px}
.trophy .td{font-size:11px;color:var(--text-2)}

/* activity */
.act{padding:10px 0}
.act+.act{border-top:1px solid var(--border)}
.act-top{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:start}
.act-txt{font-size:14px;line-height:1.35}
.act-txt em{font-family:var(--serif);font-style:italic}
.act-when{font-size:12px;color:var(--text-2);white-space:nowrap}
.reacts{display:flex;flex-wrap:nowrap;gap:6px;margin:8px 0 0}
.react{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 8px;font-size:12px;display:inline-flex;gap:5px;align-items:center;color:var(--text-2)}
.react:hover:not(:disabled){border-color:var(--primary)}
.react[aria-pressed="true"]{background:var(--primary-light);border-color:var(--primary);color:var(--primary);font-weight:600}
.react:disabled{cursor:default;opacity:.8}
.react .em{font-size:14px}
.react{min-width:44px;justify-content:center}
.cover-btn{border:0;padding:0;background:none;text-align:left;border-radius:7px;align-self:start}
.t-btn{border:0;padding:0;background:none;text-align:left;font:inherit;color:inherit}
.t-btn:hover .bk-t{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.bk.sel .cover{outline:3px solid var(--primary);outline-offset:3px}
.detail{margin-top:18px;border:1px solid var(--border);border-radius:14px;background:var(--bg);padding:18px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px}
.detail .cover{width:110px;padding:12px 10px}
.detail .cover .ct{font-size:16px}
.detail .cover .ca{font-size:10px}
.d-top{display:flex;gap:10px;align-items:flex-start}
.d-top .icon-btn{margin-left:auto}
.d-kicker{font-size:12px;font-weight:600;color:var(--primary)}
.d-title{font-size:26px;line-height:1.15}
.d-prog{display:flex;justify-content:space-between;font-size:14px;margin-top:14px}
.detail .bar{height:9px}
.d-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.d-stat{background:var(--surface-alt);border-radius:10px;padding:10px 12px}
.d-stat .l{font-size:12px;color:var(--text-2)}
.d-stat .n{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2;white-space:nowrap}
.d-stat .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-left{gap:8px!important}.side-acts{gap:3px!important}.side-acts .sa{gap:5px}
.d-stat .n small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--text-2)}
.d-stat .n.accent{color:var(--primary)}
.d-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:14px}
.link-btn{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--primary);font-weight:500;font-size:14px;padding:8px 10px;border-radius:9px}
.link-btn:hover{background:var(--primary-light)}
.privacy-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-alt);font-size:13px;color:var(--text-2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.privacy-note button{border:0;background:none;color:var(--primary);font-weight:600;font-size:13px;padding:0}

/* empty */
.empty{text-align:center;padding:18px 10px;color:var(--text-2)}
.empty svg.i{width:40px;height:40px;color:var(--secondary);stroke-width:1.4}
.empty h3{font-size:16px;color:var(--text);margin:8px 0 4px}
.empty p{margin:0 auto 12px;font-size:13px;max-width:34ch}

/* placeholder pages */
.ph{max-width:620px;margin:40px auto;text-align:center}
.ph svg.i{width:44px;height:44px;color:var(--primary)}
.ph h1{font-size:30px;margin:10px 0 6px}
.ph ul{text-align:left;display:inline-block;margin:14px 0;color:var(--text-2)}

/* bottom nav */
.bnav{display:none}

/* dialog */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 24px 60px rgba(15,23,42,.3)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg{padding:20px 22px}
.dlg-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.dlg-h h2{font-size:21px}
.dlg-h .x{margin-left:auto}
.dlg .cover{width:58px;font-size:9px}
.form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:500}
label.f .sub{font-weight:400;color:var(--text-2)}
.inp{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
.inp:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
textarea.inp{resize:vertical;min-height:64px}
.section-t{font-family:var(--serif);font-weight:600;font-size:16px;margin:2px 0 -4px}
.calc{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--text-2);background:var(--surface-alt);border-radius:10px;padding:9px 12px}
.calc b{color:var(--text)}
.err{color:var(--red);font-size:13px;min-height:0}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--primary)}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.dlg-f .btn{min-width:120px}
.radio{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.radio input{accent-color:var(--primary);width:17px;height:17px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(15,23,42,.25)}
.toast[hidden]{display:none}
.hstars{display:inline-flex;align-items:center;gap:2px}

.copy+.copy{border-top:1px solid var(--border)}
.cp-main{flex:1;min-width:140px}
.cp-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lend,.addcopy{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addcopy{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.recf{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-alt);display:grid;gap:10px}
.rate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.star{border:0;background:none;font-size:24px;line-height:1;padding:0 2px;color:var(--border)}
.star.on{color:var(--orange)}
.ad-tabs{display:flex}.ad-tabs button{flex:1;justify-content:center}
.ad-row{cursor:default;flex-wrap:wrap}
.ad-info{flex:1;min-width:150px}
.ad-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:720px){.lc-act .btn{font-size:12px;padding:6px 4px}.lc-act .btn svg.i{display:none}.st{font-size:11px}.lib-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lc-open .cover{width:80px}.lib-tools .search{flex-basis:100%}.lib-h .btn{padding:8px 12px}.board{min-height:190px}}
.t-main{display:block;font-weight:600}.t-sub{display:block;font-size:13px;opacity:.85}
.toast.cele{background:var(--primary);color:var(--on-primary);padding:12px 18px}
.rings.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.dot.rest{background:color-mix(in srgb,var(--blue) 22%,var(--track));color:var(--blue)}
.dot.rest svg.i{width:11px;height:11px;stroke-width:2.2}
.timer-box{border:1px solid color-mix(in srgb,var(--primary) 40%,var(--border));background:var(--primary-light);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.timer-box>*{min-width:0}
.timer-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.timer-t{font-family:var(--serif);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{flex-shrink:0;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums}
.timer-actions{display:flex;gap:8px}.timer-actions .btn-primary{flex:1}
.timer-pill{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 10px 30px rgba(15,23,42,.18);font-variant-numeric:tabular-nums;font-weight:600}
.timer-pill .tp-t{font-weight:400;color:var(--text-2);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-pill .btn{padding:6px 12px;border-radius:999px}
[data-edit]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (max-width:720px){.timer-pill{left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px))}.quick button{font-size:11px}}
@media (prefers-reduced-motion:reduce){.rings.pop{animation:none}}
.pick-h{font-size:13px;font-weight:600;margin:2px 0 6px}
.pick-list{display:grid;gap:6px;margin-bottom:12px}
.pick{display:flex;gap:12px;align-items:center;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 10px;text-align:left}
.pick:hover{border-color:var(--primary)}
.pick .cover{width:30px;padding:3px}
.pick .cover .ct{font-size:5px}.pick .cover .ca,.pick .cover .fmt{display:none}
.pick-t{display:block;font-weight:600;font-size:14px}
.toast{display:flex;align-items:center;gap:16px}
.toast-undo{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
.hist{display:grid;gap:18px}
.page-h{font-size:30px}
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px}
.hist-item .cover{width:100%}
.hist-item .bk-t{font-size:13px;margin-top:6px}

.carousel{position:relative}
.carousel .detail{margin-top:0}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text);box-shadow:0 2px 6px rgba(15,23,42,.12)}
.arrow.prev{left:-14px}.arrow.next{right:-14px}
.arrow:hover{border-color:var(--primary);color:var(--primary)}
.pos{margin-left:auto;font-size:13px;color:var(--text-2)}
.minis{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding:2px 2px 4px}
.mini{flex:0 0 100px;border:1px solid transparent;background:none;padding:7px;border-radius:12px;text-align:left;display:grid;gap:4px;justify-items:start;align-content:start}
.mini .cover{width:84px}
.mini-t{font-size:12px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .bar{width:84px;margin:2px 0 0}
.mini.sel{background:var(--primary-light);border-color:color-mix(in srgb,var(--primary) 35%,transparent)}
.mini:hover:not(.sel){background:var(--surface-alt)}
.more-wrap{position:relative}
.d-left{display:grid;gap:10px;align-content:start}
.side-acts{display:grid;gap:5px}
.side-acts-m{display:none}
.sa{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:transparent;color:var(--text-2);border-radius:8px;padding:3px 6px;font-size:12px;line-height:1.3;text-align:left;white-space:nowrap}
.sa svg.i{width:13px;height:13px;flex:none}
.sa:hover{color:var(--text);border-color:var(--secondary);background:var(--surface)}
.pop{position:absolute;right:0;bottom:calc(100% + 6px);min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.16);padding:6px;z-index:5}
.pop[hidden]{display:none}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14px}
.pop button:hover{background:var(--surface-alt)}
@media (max-width:720px){.arrow{top:22px;transform:none;width:34px;height:34px}.arrow.prev{left:auto;right:42px}.arrow.next{right:-2px}.carousel .detail{padding-top:16px}}
@media (max-width:1060px){
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goal{grid-template-columns:1fr}
}
@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .split>.card:first-child{border-radius:16px 16px 0 0;border-right:1px solid var(--border);border-bottom:0}
  .split>.card:last-child{border-radius:0 0 16px 16px}
}
@media (max-width:720px){
  .nav,.me-btn .nm,.me-btn .chev{display:none}
  .top-in{padding:10px 14px}
  main{padding:14px 14px calc(90px + env(safe-area-inset-bottom,0px))}
  .hero{padding:18px;min-height:0;gap:12px}
  .hero h1{font-size:24px}
  .quote{display:none}
  .day-card{display:none}
  .hero h1{font-size:22px}
  .card{padding:16px}
  .shelf:not(.all){display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px}
  .shelf:not(.all) .bk{flex:0 0 120px;grid-template-columns:1fr;scroll-snap-align:start}
  .shelf:not(.all) .cover{width:100%}
  .shelf:not(.all) .bk-actions .more-btn{display:none}
  .paused{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr;padding:14px}
  .detail .d-left .side-acts{display:none}
  .detail .d-cover .cover{width:120px!important}
  .side-acts-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .side-acts-m .sa{border-radius:999px;padding:4px 10px}
  .d-stats{grid-template-columns:1fr 1fr}
  .d-title{font-size:22px}
  .f3{grid-template-columns:1fr 1fr}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;color:var(--text-2)}
  .bnav button svg.i{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--primary);font-weight:600}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .menu{position:fixed;left:12px;right:12px;width:auto;top:calc(60px + env(safe-area-inset-top,0px))}
}
@media (min-width:721px){.toast,.toast[popover]{top:calc(78px + env(safe-area-inset-top,0px));bottom:auto;max-width:min(560px,calc(100vw - 40px));padding:12px 18px;box-shadow:0 14px 36px rgba(15,23,42,.28)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Editorial redesign layer ===== */
:root{--wall:#EEE4CF;--plank:#A97F4F;--plank-top:#C79C66;--plank-shadow:rgba(60,40,20,.28);--ph-a:#EFE4CB;--ph-b:#E2D3B1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#1A2333;--plank:#5A452F;--plank-top:#77593B;--plank-shadow:rgba(0,0,0,.5);--ph-a:#1E293B;--ph-b:#26344B}}
:root[data-theme="dark"]{--wall:#1A2333;--plank:#5A452F;--plank-top:#77593B;--plank-shadow:rgba(0,0,0,.5);--ph-a:#1E293B;--ph-b:#26344B}
body{overflow-x:clip}
h1,h2,h3{letter-spacing:-.01em}
/* header */
.brand{color:var(--text);font-size:22px;font-weight:700}
.brand svg.i{color:var(--primary)}
.nav{gap:2px}
.nav svg.i{display:none}
.nav button{border-radius:0;padding:10px 12px;font-size:15px}
.nav button[aria-current="page"]{background:none;color:var(--primary);box-shadow:inset 0 -2px 0 var(--primary);font-weight:600}
.grp-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--text);max-width:220px}
.grp-btn #grpName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-btn svg.i{width:16px;height:16px;color:var(--text-2)}
.grp-btn:hover{background:var(--surface-alt)}
#grpMenu{right:auto;left:0;width:280px}
.grp-opt{display:flex!important;align-items:center;gap:10px}
.grp-opt span{flex:1}
.grp-opt[aria-pressed="true"]{color:var(--primary);font-weight:600}
@media (max-width:720px){.grp-btn{padding:6px 8px}.grp-btn .chev{display:none}.grp-btn #grpName{max-width:110px}#grpMenu{left:12px;right:12px;width:auto}}
/* sections: open, divided by rules instead of boxes */
main section.card{background:none;border:0;border-radius:0;box-shadow:none;padding:22px 0 0;border-top:1px solid var(--border)}
main section.card .card-h{margin-bottom:16px}
main section.card .card-h h2{font-size:24px;font-weight:600}
main section.card .card-h .ico{display:none}
.card-h .more{font-size:14px}
.page-h{font-size:38px;font-weight:700;line-height:1.1}
/* placeholder for pictures added later */
.ph-img{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(120deg,var(--ph-a),var(--ph-b));display:flex;align-items:flex-end;justify-content:flex-end;padding:14px}
.ph-img::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(46,125,82,.09) 14px 30px,transparent 30px 38px,rgba(176,134,85,.12) 38px 50px,transparent 50px 58px);-webkit-mask:linear-gradient(100deg,transparent 10%,#000 70%);mask:linear-gradient(100deg,transparent 10%,#000 70%)}
.ph-img span{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:5px 10px;border-radius:999px}
.ph-img svg.i{width:15px;height:15px}
/* hero */
.hero2{margin:-20px calc(50% - 50vw) 0;background:linear-gradient(180deg,color-mix(in srgb,var(--ph-a) 55%,var(--bg)),var(--bg));border-bottom:1px solid var(--border)}
.hero2-in{max-width:1240px;margin:0 auto;padding:40px 20px 34px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:stretch}
.hero2 h1{font-size:clamp(32px,3.6vw,48px);font-weight:700;line-height:1.08}
.hero2-sub{margin:10px 0 0;font-size:16px;color:var(--text-2);max-width:44ch}
.hero2-sub.ok{color:var(--primary);font-weight:500}
.hero2-goal{display:flex;flex-wrap:wrap;gap:28px;align-items:center;margin-top:24px}
.streak2{display:grid;gap:8px;padding-left:28px;border-left:1px solid var(--border)}
.streak2 .streak-n{font-size:34px}
.streak2 .streak-n span{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--text-2);margin-left:2px}
.hero2-acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero2-acts .btn-big{min-width:200px}
.hero2-acts .timer-box{flex:1 1 100%;min-width:0;max-width:460px}
.hero2-quick{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px}
.hero2-quick button{border:0;background:none;padding:6px 0;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.hero2-quick button svg.i{width:15px;height:15px;color:var(--primary)}
.hero2-quick button:hover{color:var(--text);text-decoration:underline;text-underline-offset:3px}
/* Phones: the four shortcuts sit in one row of equal buttons, icon above label. */
@media (max-width:720px){
  .hero2-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .hero2-quick button{flex-direction:column;justify-content:flex-start;gap:5px;padding:9px 2px 8px;border-radius:12px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid color-mix(in srgb,var(--border) 70%,transparent);font-size:12px;line-height:1.2;text-align:center;color:var(--text)}
  .hero2-quick button svg.i{width:18px;height:18px}
  .hero2-quick button:hover{text-decoration:none}
}
.hero2-img{min-height:300px}
/* dashboard grid */
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0 44px;margin-top:30px;align-items:start}
.dmain,.dside{display:grid;gap:36px;min-width:0;align-content:start}
.dside{border-left:1px solid var(--border);padding-left:32px}
.dside section.card:first-child{border-top:0;padding-top:0}
.dmain>section.card:first-child{border-top:0;padding-top:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px}
.detail{border:0;background:none;padding:0;border-radius:0}
.detail .cover{width:140px}
.carousel .detail{grid-template-columns:150px minmax(0,1fr);gap:28px}
.d-title{font-size:28px}
.d-stats{border-top:1px solid var(--border);padding-top:12px}
.paused{grid-template-columns:1fr}
.un-row{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px}
.un-b{border:0;background:none;padding:0;text-align:left;display:grid;gap:3px;color:inherit;position:relative;width:100%}
.un-b .cover{width:100%}
.un-n{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:6px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:600;vertical-align:1px;color:var(--text-2)}
.un-t{font-size:13px;font-weight:600;line-height:1.25;margin-top:4px}
.un-b:hover .un-t{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.trophies{grid-template-columns:repeat(3,minmax(0,1fr))}
.mini-cal{gap:4px}
.mini-cal .cal-d{border-radius:50%;font-size:12px}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0 0;border-top:1px solid var(--border);padding-top:14px}
.mstats dt{font-size:12px;color:var(--text-2)}
.mstats dd{margin:0;font-family:var(--serif);font-size:22px;font-weight:600}
.mstats dd small{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--text-2)}
.stat{background:none;text-align:left;padding:6px 0 6px 14px;border-left:1px solid var(--border);border-radius:0}
/* tabs as underlines */
.tabs{gap:26px;border-bottom:1px solid var(--border);padding-bottom:0}
.tabs>.tab{border:0;border-radius:0;background:none;padding:10px 0 12px;margin-bottom:-1px;color:var(--text-2);font-size:15px;border-bottom:2px solid transparent}
.tabs>.tab:hover{color:var(--text);border-color:transparent;border-bottom-color:var(--border)}
.tabs>.tab[aria-selected="true"]{background:none;color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
/* library */
.lib-band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px;align-items:stretch;margin-bottom:22px}
.lib-band-t{display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.lib-band-t .btn{margin-top:18px}
.lib-img{min-height:150px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.bookcase{display:grid;gap:30px}
.shelf-g{margin:0;scroll-margin-top:90px}
.shelf-l{font-size:22px;margin-bottom:10px}
.shelf-l .count{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--text-2);margin-left:6px}
.board{--row:236px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 3px;overflow:visible;min-height:0;padding:20px 18px 0;border-radius:4px 4px 0 0;
  background-color:var(--wall);background-image:repeating-linear-gradient(to bottom,transparent 0 var(--row),var(--plank-top) var(--row) calc(var(--row) + 3px),var(--plank) calc(var(--row) + 3px) 100%);background-size:100% calc(var(--row) + 16px);background-origin:content-box;
  border:10px solid var(--plank);border-top-width:12px;border-bottom-width:18px;box-shadow:inset 0 10px 18px -10px var(--plank-shadow),0 6px 14px -8px var(--plank-shadow)}
/* Spines: decorations live only in the head and tail; each decoration sets the padding so lettering always sits in the clear space between. */
.spine{width:var(--w);height:var(--h);margin-top:calc(var(--row) - var(--h));position:relative;overflow:hidden;justify-content:flex-start;gap:9px;padding:12px 0;border-radius:2px 2px 0 0;color:var(--ink);text-orientation:sideways;
  --gold:#C9A75A;--base:linear-gradient(90deg,color-mix(in srgb,var(--sb) 70%,#000) 0,var(--sb) 16%,color-mix(in srgb,var(--sb) 95%,#fff) 48%,var(--sb) 80%,color-mix(in srgb,var(--sb) 68%,#000) 100%);background-color:var(--sb);background-image:var(--base)}
.spine .sp-t{position:relative;z-index:1;flex:1 1 0;min-height:0;max-height:none;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;line-height:1.18;font-size:12.5px}
.spine .sp-t .l{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine .sp-a{position:relative;z-index:1;flex:0 1 auto;min-height:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:1;font-family:var(--sans);font-size:9.5px;letter-spacing:.04em}
/* Lettering */
.lt-serif .sp-t{font-family:var(--serif);font-weight:600}
.lt-smcaps .sp-t{font-family:var(--serif);font-weight:600;font-variant-caps:small-caps;letter-spacing:.05em;font-size:13px}
.lt-italic .sp-t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:13px}
.lt-cond .sp-t{font-family:"Oswald","Arial Narrow",sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
/* Finishes */
.fn-cloth{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),var(--base)}
.fn-linen{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 4px,rgba(255,255,255,.03) 4px 5px,transparent 5px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 5px),var(--base)}
.fn-pebbled{background-image:radial-gradient(circle at 1.5px 1.5px,rgba(0,0,0,.2) 0 1px,transparent 1.5px),radial-gradient(circle at 3.5px 3.5px,rgba(255,255,255,.035) 0 .9px,transparent 1.3px),var(--base);background-size:4px 4px,5px 5px,auto}
/* Decorations, head and tail only */
.dk-bands{padding:23px 0}
.dk-bands::before,.dk-bands::after{content:"";position:absolute;left:2px;right:2px;height:7px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}

.hero-photo-btn{position:absolute;right:max(20px,calc(50% - 600px));bottom:16px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(4px)}

.un-row{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:14px 12px}
.un-b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:static}
.un-b .cover-btn .cover{width:64px}
.un-t{font-size:12.5px;line-height:1.25;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.un-a{font-size:11.5px;color:var(--text-2)}
.un-n{width:17px;height:17px;font-size:10px;margin-right:4px}
.un-acts{display:flex;gap:2px;margin:2px 0 0 -6px}
.un-acts .icon-btn{padding:4px}
.un-acts svg.i{width:15px;height:15px}

.plate:not(:first-child){margin-left:10px}
.plate{padding:0 5px}
.bookend{position:relative;width:46px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding-top:22px;border-radius:23px 23px 2px 2px;
  background:linear-gradient(90deg,#8E6A2C 0%,#D9B66A 22%,#F1DB9F 42%,#C9A04F 62%,#8E6A2C 100%);box-shadow:inset 0 0 0 3px rgba(255,240,200,.35),inset 0 0 0 4px rgba(90,60,20,.35),0 4px 8px var(--plank-shadow)}
.bookend::after{content:"";position:absolute;left:-4px;right:-4px;bottom:0;height:8px;border-radius:2px;background:linear-gradient(180deg,#B08A43,#7A5A24)}

.flat{height:var(--fh,26px)}

  .hero2-in{min-height:0;padding-bottom:56px}
  .hero-photo-btn{right:14px;bottom:12px}

.d-stat{background:none;border-left:1px solid var(--border);border-radius:0;padding:2px 0 2px 12px}

  const ls=S.sessions.filter(x=>x.minutes).sort((a,b)=>b.minutes-a.minutes)[0];

/* Character counter for note boxes: a textarea with data-count shows "n / max characters" in the element its aria-describedby names, orange in the last 10%. */
const charCount=(id,len,max)=>`<div class="xs muted char-count ${len>=max*.9?'near':''}" id="${id}">${len.toLocaleString()} / ${max.toLocaleString()} characters</div>`;

  const flats=x=>[...x.el.querySelectorAll('.flat')].map(f=>f.getBoundingClientRect());
  const lean=(x,side,th,dx)=>{x.el.style.transformOrigin=side==='left'?'left bottom':'right bottom';x.el.style.rotate=(side==='left'?-th:th).toFixed(2)+'deg';x.el.style.translate=dx.toFixed(1)+'px 0';x.leaned=true};
  rows.forEach(row=>{

      const prev=row[i-1],next=row[i+1];
      // Beside a flat stack: lean over onto it, touching the nearest flat's corner.
      if(next&&next.el.classList.contains('stack')&&!(prev&&prev.el.classList.contains('stack'))&&pick(21,2)===0){
        const th=Math.min(...flats(next).map(f=>Math.atan2(f.left-x.r.right-1.5,bottom-f.top)))/deg;
        if(th>=3)lean(x,'right',Math.min(th,16),0);return;
      }
      if(prev&&prev.el.classList.contains('stack')&&next&&pick(22,2)===0){
        const th=Math.min(...flats(prev).map(f=>Math.atan2(x.r.left-f.right-1.5,bottom-f.top)))/deg;
        if(th>=3)lean(x,'left',Math.min(th,16),0);return;
      }
      // End of a row with room after it: tip against the neighbor, or slide over and lean on the wall.
      if(i!==row.length-1)return;

}

async function teSearch(){

    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);bmp.close?.();
    te.cover=cv.toDataURL('image/jpeg',.82);te.src='upload';te.bad=false;te.touched=true;document.getElementById('teErr').textContent='';tePreview();

  if(te.bad)return er('The cover image didn’t load. Choose a different one, or use the generated cover.');

/* Open Library search. Runs in the reader's browser; no account or key needed. */
const OL_FIELDS='key,title,author_name,first_publish_year,number_of_pages_median,cover_i';
let olTimer,olCtl;
const olKey=raw=>raw.trim().toLowerCase().replace(/\s+/g,' ');
const olIsbn=raw=>{const d=raw.replace(/[-\s]/g,'');return /^(\d{9}[\dXx]|\d{13})$/.test(d)?d.toUpperCase():''};
const olExisting=x=>S.titles.find(t=>t.olKey===x.key||t.title.toLowerCase()===x.title.toLowerCase()&&t.author.toLowerCase()===x.author.toLowerCase());
function olQueue(){
  clearTimeout(olTimer);const raw=ad.q.trim(),k=olKey(raw);
  if(raw.length<3){olCtl?.abort();ad.ol=null;return}
  if(ad.ol&&ad.ol.q===k&&ad.ol.state!=='error')return;
  ad.ol={q:k,state:'loading',items:[]};olTimer=setTimeout(()=>olFetch(raw),350);
}
/* Search Open Library by title, author, or ISBN; used by Add a Book and Start a Book. */
async function olSearch(raw,signal){
  const k=olKey(raw),isbn=olIsbn(raw);
  const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(isbn?'isbn:'+isbn:k)}&fields=${OL_FIELDS}&limit=12`,{signal,headers:{Accept:'application/json'}});
  if(!r.ok)throw new Error('Open Library '+r.status);
  const j=await r.json();
  return (j.docs||[]).filter(d=>d.title).map(d=>({key:d.key,title:d.title,author:(d.author_name||[]).slice(0,2).join(', ')||'Unknown author',year:d.first_publish_year||'',pages:d.number_of_pages_median||0,coverId:d.cover_i||0,isbn}));
}
async function olFetch(raw){
  const k=olKey(raw),isbn=olIsbn(raw);
  olCtl?.abort();olCtl=new AbortController();
  try{
    const items=await olSearch(raw,olCtl.signal);
    if(ad.ol?.q===k)ad.ol={q:k,state:'done',items};
  }catch(e){if(e.name==='AbortError')return;if(ad.ol?.q===k)ad.ol={q:k,state:'error',items:[]}}
  const el=document.getElementById('adRes');if(el&&addDlg.open&&ad.tab==='search')el.innerHTML=adResults();
}
function olSection(res){

  if(raw.length<3)return res.length?'':`<p class="xs muted" style="margin:0">Keep typing to search Open Library.</p>`;
  if(!o||o.q!==olKey(raw)||o.state==='loading')return h+`<p class="xs muted" role="status">Searching Open Library…</p>`;
  if(o.state==='error')return h+`<div class="empty"><h3>Search Isn’t Working Right Now</h3><p>Open Library didn’t answer. Check your connection and try again, or add the book yourself.</p><button class="btn btn-ghost" data-act="adRetry">Try Again</button> ${manual}</div>`;
  const items=o.items.map((x,i)=>({x,i})).filter(({x})=>{const t=olExisting(x);return !t||!res.includes(t)});
  if(!items.length)return res.length?`<p class="xs muted">Not the book you want? ${manual}</p>`:`<div class="empty"><h3>No Matches Found</h3><p>Open Library doesn’t have a match. Check the spelling, try the author or ISBN, or add the book yourself.</p>${manual}</div>`;
  return h+`<div class="pick-list">${items.map(({x,i})=>{
    const t=olExisting(x),r=t&&myReading(t.id),own=t&&copiesOf(t.id).some(c=>c.owner==='me');
    const cv=libCover({title:x.title,author:x.author,c:hashStr(x.title)%COVERS.length,cover:x.coverId?`https://covers.openlibrary.org/b/id/${x.coverId}-S.jpg`:''});
    return `<div class="pick ad-row">${cv}<span class="ad-info"><span class="pick-t">${esc(x.title)}</span><span class="xs muted">${[esc(x.author),x.year,x.pages?`${x.pages} pages`:''].filter(Boolean).join(' · ')}</span></span>
    <span class="ad-acts">${ad.olOwn===i?`<span class="small muted">Format:</span>${['physical','ebook','audio'].map(f=>`<button class="btn btn-primary sm" data-act="adOLGo" data-i="${i}" data-f="${f}">${FMT[f]}</button>`).join('')}`
      :`<button class="btn btn-ghost sm" data-act="adOLOwn" data-i="${i}" ${own?'disabled':''}>${own?'You Own It':'I Own It'}</button>`}
    ${r&&r.status==='want'?`<span class="xs muted">On To Read</span>`:r&&r.status!=='finished'&&r.status!=='dnf'?`<span class="xs muted">${STATUS[r.status]}</span>`:`<button class="btn btn-ghost sm" data-act="adOLWant" data-i="${i}">Add to To Read</button>`}</span></div>`}).join('')}</div>
  <p class="xs muted">Not the book you want? ${manual}</p><p class="xs muted" style="margin:0">Book details and covers from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>.</p>`;
}
/* Finds covers for books added before Find a Book, or added by hand. Works through them one at a
   time in the background, saves each cover on the title so it's only looked up once, and tries
   books with no match again after 30 days. */
const COVER_RETRY=30*864e5;
let coverBusy=false,coverDraw;
async function olCoverFor(t){
  const base=`https://openlibrary.org/search.json?fields=key,cover_i&limit=5&`;
  const au=t.author&&t.author!=='Unknown author'?t.author:'';
  const tries=[`title=${encodeURIComponent(t.title)}${au?`&author=${encodeURIComponent(au)}`:''}`,`q=${encodeURIComponent(t.title+(au?' '+au:''))}`];
  for(const qs of tries){
    const r=await fetch(base+qs,{headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error('Open Library '+r.status);
    const d=((await r.json()).docs||[]).find(x=>x.cover_i);
    if(d)return d;
  }
  return null;
}
function coverRedraw(){
  clearTimeout(coverDraw);
  coverDraw=setTimeout(()=>{
    if(document.activeElement?.closest('input,select,textarea')||document.querySelector('.menu:not([hidden])'))return coverRedraw();
    const y=window.scrollY;render();window.scrollTo(0,y);if(bookDlg.open)renderBD();if(addDlg.open)renderAdd(true);
  },2500);
}
async function coverFill(){
  if(coverBusy||navigator.onLine===false)return;coverBusy=true;
  try{
    const todo=S.titles.filter(t=>!t.cover&&!t.noAutoCover&&!(t.coverTried>Date.now()-COVER_RETRY));
    for(const t of todo){
      if(t.cover||!S.titles.includes(t))continue;
      let d;try{d=await olCoverFor(t)}catch(e){break}
      t.coverTried=Date.now();
      if(d){t.cover=`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`;if(!t.olKey)t.olKey=d.key;coverRedraw()}
      save();
      await new Promise(r=>setTimeout(r,1000));
    }
  }finally{coverBusy=false}
}

/* Drafts: Log Reading, calendar notes, and Edit Session keep what you're typing in this browser, about a second after
   you stop and again whenever the form closes without saving (the close button, Esc). Reopening the form fills it back
   in, with Discard. Save clears the draft; Cancel clears it too, with Undo. Drafts older than a week are dropped. */
const DRAFT_KEY='rr_drafts_v1',DRAFT_TTL=7*864e5;
const draftsAll=()=>{try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY))||{},now=Date.now();let gone=false;for(const k in d)if(now-d[k].ts>DRAFT_TTL){delete d[k];gone=true}if(gone)localStorage.setItem(DRAFT_KEY,JSON.stringify(d));return d}catch(e){return {}}};
const draftsPut=d=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(d))}catch(e){}};
function formFields(form){
  const out={};form.querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{
    if(el.type==='checkbox'){const many=form.querySelectorAll(`input[type=checkbox][name="${el.name}"]`).length>1;if(many){(out[el.name]=out[el.name]||[]);if(el.checked)out[el.name].push(el.value)}else out[el.name]=el.checked}
    else if(el.type!=='file'&&el.type!=='radio'&&el.name!=='book')out[el.name]=el.value});
  return out;
}
function fillFields(form,f,skip){
  for(const [k,v] of Object.entries(f)){if(skip&&skip.includes(k))continue;
    const els=form.querySelectorAll(`[name="${k}"]`);
    els.forEach(el=>{if(el.type==='checkbox')el.checked=Array.isArray(v)?v.includes(el.value):!!v;else el.value=v});
    els.forEach(el=>{if(el.tagName==='TEXTAREA'||el.tagName==='INPUT'&&el.type!=='checkbox')el.dispatchEvent(new Event('input',{bubbles:true}))});}
}
function draftSave(form){const k=form.dataset.dkey;if(!k||form.dataset.done==='1'||form.dataset.dirty!=='1')return;const d=draftsAll();d[k]={f:formFields(form),ts:Date.now()};draftsPut(d)}
function draftClear(k){const d=draftsAll();delete d[k];draftsPut(d)}
/* Call after a form is drawn: tags it with its draft key and fills in a saved draft, if any. */
function draftAttach(form,key,label,skip){
  form.dataset.dkey=key;form.dataset.dirty='';form.dataset.done='';
  const d=draftsAll()[key];if(!d)return false;
  fillFields(form,d.f,skip);form.dataset.dirty='1';
  const at=new Date(d.ts),when=at.toDateString()===new Date().toDateString()?at.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):fmtDate(ds(at));
  const bar=document.createElement('div');bar.className='draft-note';bar.setAttribute('role','status');
  bar.innerHTML=`<span class="small">Restored your unsaved ${label} from ${when}.</span><button type="button" class="link-btn sm" data-act="draftDiscard">Discard</button>`;
  const h=form.querySelector('.dlg-h');h?h.after(bar):form.prepend(bar);return true;
}
let draftTimer;
document.addEventListener('input',e=>{const form=e.target.closest?.('form[data-dkey]');if(!form||!e.isTrusted)return;form.dataset.dirty='1';clearTimeout(draftTimer);draftTimer=setTimeout(()=>draftSave(form),900)},true);
document.addEventListener('change',e=>{const form=e.target.closest?.('form[data-dkey]');if(!form||!e.isTrusted)return;form.dataset.dirty='1';clearTimeout(draftTimer);draftTimer=setTimeout(()=>draftSave(form),900)},true);
/* Cancel: discard, with Undo that reopens the form as it was. */
function draftCancel(form,dlg,reopen,label){
  const k=form.dataset.dkey,f=form.dataset.dirty==='1'?formFields(form):null;
  form.dataset.done='1';clearTimeout(draftTimer);if(k)draftClear(k);dlg.close();
  if(f)toast(`Discarded your ${label}.`,()=>{const d=draftsAll();d[k]={f,ts:Date.now()};draftsPut(d);reopen()});
}

  sessForm.dataset.done='1';draftClear(sessForm.dataset.dkey);syncPos(b);save();sessDlg.close();render();toast('Session updated.',null,'Goals, streaks, challenges, and records recalculate automatically.');

function ruleOk(c,tid){const r=c.rule||'all';if(r==='none')return false;if(r==='all')return true;const t=titleById(tid);if(!t)return false;

function contrib(c){
  const I=c.inc||{},X=c.exc||{},T=today(),items=[];

    S.books.forEach(b=>{if(!fit(b))return;const auto=(c.type==='list'||(c.rule||'all')!=='none')&&inWin(c,b.finished)&&(c.type==='list'||ruleOk(c,b.titleId)),man=has(I.books,b.id);
      if(!auto&&!man)return;items.push({kind:'books',key:b.id,auto:auto&&!man,removed:has(X.books,b.id),date:b.finished||'',titleId:b.titleId,label:b.title,sub:`${esc(b.author)}${b.finished?` · Finished ${fmtDateY(b.finished)}`:''}`,amt:1})});

    const sesAuto=x=>(c.rule||'all')!=='none'&&inWin(c,x.date)&&ruleOk(c,titleOfSession(x));
    if(c.type==='days'||c.type==='goaldays'){
      const dates={};S.sessions.forEach(x=>{if(x.date>T)return;const a=sesAuto(x),m=has(I.days,x.date);if(a||m){const d=dates[x.date]||(dates[x.date]={auto:false,man:m,books:new Set()});if(a)d.auto=true;d.books.add(book(x.bookId)?.title||'')}});
      Object.entries(dates).forEach(([d,o])=>{if(c.type==='goaldays'&&!goalState(d).met)return;items.push({kind:'days',key:d,auto:o.auto&&!o.man,removed:has(X.days,d),date:d,label:fmtDateY(d),sub:esc([...o.books].filter(Boolean).join(', ')),amt:1})});
    }else S.sessions.forEach(x=>{if(x.date>T)return;const a=sesAuto(x),m=has(I.sessions,x.id);if(!a&&!m)return;const b=book(x.bookId);
      const amt=c.type==='pages'?(x.pages||0):(x.minutes||(S.settings.estimate?x.est||0:0));
      items.push({kind:'sessions',key:x.id,auto:a&&!m,removed:has(X.sessions,x.id),date:x.date,label:b?b.title:'Reading session',sub:`${fmtDateY(x.date)} · ${x.pages?`${x.pages} pages`:''}${x.pages&&(x.minutes||x.est)?' · ':''}${x.minutes?fmtMin(x.minutes):x.est?`~${fmtMin(x.est)} estimated`:''}`,amt,est:!x.minutes&&x.est&&S.settings.estimate?x.est:0})});

function readLog(){

function calcLog(){

      parts.push(`Pages read <b>${span}</b>`);
      if(minutes&&!isNaN(minutes)&&minutes>0)parts.push(`Speed <b>${Math.round(span/minutes*60)} pages/hr</b>`);
      else if(g.estimate&&span>0){const p=pace(b.id);if(p)parts.push(`About <b>${Math.round(span/p)} min</b> (estimated)`)}
    }

  }else parts.push('Pages read <b>—</b>');
  const dt=logForm.querySelector('[name=date]')?.value||today();const ts=goalState(dt);

  if(start!=null&&end!=null&&!isNaN(start)&&!isNaN(end)&&end>=start){if(audio){if(g.estimate)addM=end-start}else addP=end-start}
  if(minutes&&!isNaN(minutes))addM=minutes;else if(!audio&&addP&&g.estimate){const p=pace(b.id);if(p)addM=addP/p}

    case 'more':{const pop=document.getElementById('morePop');pop.hidden=!pop.hidden;a.setAttribute('aria-expanded',String(!pop.hidden));break}
    case 'finish':{const snap=snapshot(),b=book(id);b.status='finished';b.finished=today();b.pos=b.total;selBook=null;
      if(S.settings.share)S.activity.push({id:uid(),who:'me',kind:'finished',text:'finished',book:b.title,ts:Date.now(),r:{}});
      S.trophies.push({id:uid(),name:'Finished!',desc:b.title,date:today(),tier:'badge',icon:'check',hue:'green'});
      save();render();toast(`Finished ${b.title}. Nice work!`,restoreTo(snap));break}
    case 'react':{const it=S.activity.find(x=>x.id===a.dataset.id);if(it.r.me===a.dataset.r)delete it.r.me;else it.r.me=a.dataset.r;save();render();break}
    case 'share':S.settings.share=!S.settings.share;save();render();if(!document.getElementById('meMenu').hidden||a.closest('.menu'))document.getElementById('meMenu').hidden=false;toast(S.settings.share?'Your activity is now shared with your groups.':'Your activity is now private.');break;
    case 'theme':S.settings.theme=a.dataset.v;save();renderHeader();document.getElementById('meMenu').hidden=false;break;
    case 'notifGo':{const n=S.notifs.find(x=>x.id===a.dataset.id);n.read=true;save();closeMenus();const L=n.link;
      if(L.type==='ch'){view='challenges';chTab='family';render();window.scrollTo(0,0);openCh(L.id)}
      else if(L.type==='battle'){view='challenges';chTab='battle';render();window.scrollTo(0,0);openBattle(L.id)}
      else if(L.type==='title'){openTitle(L.id)}
      else{view='library';lib.tab='recs';lib.rv='from';render();window.scrollTo(0,0)}
      break}
    case 'dismiss':S.notifs=S.notifs.filter(n=>n.id!==a.dataset.id);save();renderHeader();document.getElementById('bellMenu').hidden=false;break;
    case 'emptyDemo':{const keep=S.settings;S=seed();prepState();S.settings={...keep,gsHidden:false,protoView:'new'};S.copies=S.copies.filter(c=>c.owner!=='me');S.battles.forEach(b=>{delete b.readers.me;if(b.moderator==='me')b.moderator=null;if(b.winner==='me')delete b.winner});S.recsSent=[];S.upNext=[];S.books=[];S.sessions=[];S.challenges=[];S.trophies=[];S.activity=[];S.notifs=[];save();closeMenus();view='dashboard';render();toast('Showing the new-member view.');break}
    case 'resetDemo':{const th=S.settings.theme;S=seed();prepState();S.settings.theme=th;S.settings.protoView='sample';save();closeMenus();view='dashboard';render();setTimeout(coverFill,500);toast('Sample data restored.');break}
    case 'soon':toast(`${a.dataset.what} comes with the Library.`);break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenus();const pop=document.getElementById('morePop');if(pop)pop.hidden=true}
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&document.activeElement?.closest('#crCard')&&!document.activeElement.closest('input,select,textarea')){e.preventDefault();stepBook(e.key==='ArrowLeft'?-1:1,e.key==='ArrowLeft'?'prevBook':'nextBook')}
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.target.closest('#detail')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)stepBook(dx<0?1:-1)});
paintIcons();
readRoute();
render();
setTimeout(coverFill,1000);
setTimeout(maybeOfferTour,700);
</script>
</body>
</html>
