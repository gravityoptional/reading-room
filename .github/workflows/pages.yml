# Publishes the test copy (the main branch) at the site address. Alpha was retired Nov 9, 2026; /beta/ forwards to
# the site address so old links keep working.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Assemble the site
        run: |
          mkdir -p _site/beta
          cp main/index.html _site/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Reading Room Beta</title><meta name="robots" content="noindex">' \
            '<script>location.replace("../"+location.search+location.hash)</script>' \
            '<p>Reading Room Beta has moved to <a href="../">the site address</a>.</p>' > _site/beta/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
